---
# Handlers run in the order defined here: reload must precede restart.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter.service
    state: restarted
  # The unit does not exist when the package install was only simulated.
  when: not (ansible_check_mode and node_exporter_package is changed)
